<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nursing Assistant Study Cards | የነርስ ረዳት የጥናት ካርዶች</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mute:#5d677d;--line:#dde2ee;--pri:#3b5bdb;--pri-ink:#fff;--ok:#1f8a4c;--bad:#c9432f;--am:#7a3e00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--card:#1b2030;--ink:#eef1f8;--mute:#a4adc2;--line:#2b3247;--pri:#7c93ff;--pri-ink:#0d1020;--ok:#4cc27f;--bad:#ff8a73;--am:#ffc98a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 "Noto Sans Ethiopic","Nyala","Abyssinica SIL",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px;line-height:1.3}
h1 span{display:block;font-size:1rem;color:var(--mute);font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;font-size:.9rem;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--pri)}
button[aria-pressed=true],button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button:focus-visible,.card:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.deck{flex:1 1 200px;text-align:left}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.stat{font-size:.85rem;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:12px 0;min-height:260px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);user-select:none}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 2px}
.en{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.am{font-size:1.15rem;font-weight:700;color:var(--am)}
.side .en,.side .am{font-weight:400;font-size:1.05rem}
.side .am{color:var(--ink)}
.side hr{border:0;border-top:2px dashed var(--line);margin:16px 0}
.hint{text-align:center;font-size:.8rem;color:var(--mute);margin-top:14px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav .full{grid-column:1/-1}
.learn{border-color:var(--bad);color:var(--bad)}.know{border-color:var(--ok);color:var(--ok)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
.item summary{padding:14px 16px;cursor:pointer;font-weight:700;list-style:none}
.item summary span{display:block;color:var(--am);font-weight:700}
.item .side{padding:0 16px 16px}
.item[data-s=known] summary::after{content:" ✓";color:var(--ok)}
input[type=search]{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
.done{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Nursing Assistant Study Cards <span lang="am">የነርስ ረዳት የጥናት ካርዶች</span></h1>
  <div class="row" id="decks" role="group" aria-label="Choose a deck"></div>
  <div class="row">
    <button id="bShuf" aria-pressed="false">Shuffle | አዋህድ</button>
    <button id="bLearn" aria-pressed="false">Still learning only | ገና የምማራቸው</button>
    <button id="bView">List view | ዝርዝር</button>
    <button id="bReset">Reset | እንደገና ጀምር</button>
  </div>
  <div id="app"></div>
</div>
<script>
const DECKS=[{"id": "vocab", "title": "Vocabulary | ቃላት", "cards": [{"en": "Full dentures", "am": "ሙሉ ሰው ሠራሽ ጥርሶች", "bEn": "A set of fake teeth that replaces all of a person's natural teeth.", "bAm": "ሁሉንም የተፈጥሮ ጥርሶች የሚተካ ሰው ሠራሽ ጥርሶች ስብስብ ነው።"}, {"en": "Alopecia", "am": "አሎፔሺያ (የፀጉር መርገፍ)", "bEn": "Alopecia is hair loss. It can happen on the head or on the body.", "bAm": "አሎፔሺያ የፀጉር መርገፍ ነው። በራስ ወይም በሰውነት ላይ ሊከሰት ይችላል።"}, {"en": "Orange stick", "am": "የጥፍር ማጽጃ እንጨት", "bEn": "A thin wooden stick used to clean under the nails.", "bAm": "ከጥፍር ስር ለማጽዳት የሚያገለግል ቀጭን የእንጨት ዱላ ነው።"}, {"en": "Prosthesis", "am": "ሰው ሠራሽ የአካል ክፍል (ፕሮስቴሲስ)", "bEn": "A device that replaces a missing body part. An artificial leg or arm is an example.", "bAm": "የጎደለ የአካል ክፍልን የሚተካ መሣሪያ ነው። ሰው ሠራሽ እግር ወይም ክንድ ምሳሌ ነው።"}, {"en": "Mastectomy", "am": "ማስቴክቶሚ (ጡት ማስወገድ)", "bEn": "Surgery to remove a breast.", "bAm": "ጡትን ለማስወገድ የሚደረግ ቀዶ ሕክምና ነው።"}, {"en": "Orthosis", "am": "ኦርቶሲስ (ደጋፊ መሣሪያ)", "bEn": "A device, like a brace, that supports or protects a weak or injured body part.", "bAm": "የደከመ ወይም የተጎዳ የአካል ክፍልን የሚደግፍ ወይም የሚጠብቅ መሣሪያ ነው። ማሰሪያ ምሳሌ ነው።"}, {"en": "Shear", "am": "ሽር (የቆዳ መጎተት)", "bEn": "Shear happens when the skin stays in place but the bone under it moves. It pulls and can damage deep tissue. Sliding down in bed can cause it.", "bAm": "ሽር የሚከሰተው ቆዳ ባለበት ሲቆይ ከስሩ ያለው አጥንት ሲንቀሳቀስ ነው። ጥልቅ ሕብረ ሕዋስን ይጎትታል፣ ሊጎዳም ይችላል። አልጋ ላይ ወደ ታች መንሸራተት ሊያስከትለው ይችላል።"}, {"en": "Friction", "am": "ሰበቃ", "bEn": "Friction is when two surfaces rub against each other. It can hurt the skin.", "bAm": "ሰበቃ ሁለት ገጽታዎች እርስ በርስ ሲፋተጉ ነው። ቆዳን ሊጎዳ ይችላል።"}, {"en": "Pressure injuries", "am": "የግፊት ቁስለት (የአልጋ ቁስል)", "bEn": "Damage to the skin and tissue caused by pressure on one area for a long time. They are also called bedsores.", "bAm": "በአንድ ቦታ ላይ ለረጅም ጊዜ በሚደርስ ጫና የሚመጣ የቆዳና የሕብረ ሕዋስ ጉዳት ነው። የአልጋ ቁስል ተብሎም ይጠራል።"}, {"en": "Bony prominence", "am": "የሚወጣ አጥንት ቦታ", "bEn": "A place where bone is close under the skin. The heel, hip, and tailbone are examples.", "bAm": "አጥንት ከቆዳ ስር ቀርቦ የሚገኝበት ቦታ ነው። ተረከዝ፣ ዳሌና የጅራት አጥንት ምሳሌዎች ናቸው።"}, {"en": "Eschar", "am": "እስካር (ጥቁር የሞተ ቆዳ)", "bEn": "Dead, dry, black or brown tissue on a wound.", "bAm": "በቁስል ላይ የሚገኝ የሞተ፣ የደረቀ፣ ጥቁር ወይም ቡናማ ሕብረ ሕዋስ ነው።"}, {"en": "Debridement", "am": "የሞተ ሕብረ ሕዋስ ማስወገድ", "bEn": "Removing dead tissue from a wound so that it can heal.", "bAm": "ቁስሉ እንዲድን የሞተ ሕብረ ሕዋስን ከቁስል ላይ ማስወገድ ነው።"}, {"en": "Immobility", "am": "አለመንቀሳቀስ", "bEn": "Not being able to move, or moving very little.", "bAm": "መንቀሳቀስ አለመቻል ወይም በጣም ትንሽ መንቀሳቀስ ነው።"}, {"en": "Maceration", "am": "ማሴሬሽን (በእርጥበት የቆዳ መለሰለስ)", "bEn": "Skin that stays too wet for too long becomes soft, white, and weak.", "bAm": "ለረጅም ጊዜ በጣም የረጠበ ቆዳ ይለሰልሳል፣ ነጭ ይሆናል፣ ይደክማልም።"}, {"en": "Microclimate", "am": "ማይክሮክላይሜት (የቆዳ አካባቢ ሙቀትና እርጥበት)", "bEn": "The heat and wetness of the skin where it touches a surface, like a mattress.", "bAm": "ቆዳ እንደ ፍራሽ ካለ ገጽ ጋር በሚነካካበት ቦታ ያለው የሙቀትና የእርጥበት መጠን ነው።"}, {"en": "Blanching / blanchable", "am": "ሲጫኑ የሚነጣ", "bEn": "Press on red skin. If it turns white and then red again when you let go, it is blanchable.", "bAm": "ቀይ ቆዳን ይጫኑ። ሲጫኑት ነጭ ሆኖ ሲለቁት እንደገና ቀይ ከሆነ፣ ሲጫኑ የሚነጣ ይባላል።"}, {"en": "Edematous", "am": "እብጠት ያለበት (ኤደማተስ)", "bEn": "Swollen because of extra fluid in the tissue.", "bAm": "በሕብረ ሕዋስ ውስጥ ባለ ተጨማሪ ፈሳሽ ምክንያት ያበጠ ማለት ነው።"}, {"en": "Epidermis", "am": "ኤፒደርሚስ (የቆዳ የላይኛው ንብርብር)", "bEn": "The top, outer layer of the skin.", "bAm": "የቆዳ የላይኛው ውጫዊ ንብርብር ነው።"}, {"en": "Dermis", "am": "ደርሚስ (የቆዳ መካከለኛ ንብርብር)", "bEn": "The middle layer of the skin. It has blood vessels, nerves, and hair roots.", "bAm": "የቆዳ መካከለኛ ንብርብር ነው። የደም ሥሮች፣ ነርቮችና የፀጉር ሥሮች አሉት።"}, {"en": "Subcutaneous tissue", "am": "ከቆዳ ስር ያለ ሕብረ ሕዋስ", "bEn": "The fatty layer under the skin. It protects the body and keeps it warm.", "bAm": "ከቆዳ ስር ያለ የስብ ንብርብር ነው። ሰውነትን ይጠብቃል፣ ያሞቃልም።"}, {"en": "Alternating pressure pads", "am": "ተለዋዋጭ ግፊት ፓዶች", "bEn": "Air-filled pads that fill and empty in turn. This changes where the pressure touches the body.", "bAm": "በየተራ የሚነፉና የሚሟሽሹ በአየር የተሞሉ ፓዶች ናቸው። ግፊቱ በሰውነት ላይ የሚያርፍበትን ቦታ ይቀይራሉ።"}, {"en": "Friction / shearing prevention device(s)", "am": "ሰበቃንና መጎተትን መከላከያ መሣሪያዎች", "bEn": "Items that protect the skin from rubbing and pulling. Slide sheets and heel protectors are examples.", "bAm": "ቆዳን ከመፈተግና ከመጎተት የሚጠብቁ እቃዎች ናቸው። የመንሸራተቻ ሉሆችና የተረከዝ መከላከያዎች ምሳሌዎች ናቸው።"}, {"en": "Urinary retention", "am": "ሽንት መያዝ", "bEn": "Not being able to empty the bladder fully. Urine stays in the bladder.", "bAm": "ፊኛን ሙሉ በሙሉ ማጥፋት አለመቻል ነው። ሽንት በፊኛ ውስጥ ይቀራል።"}, {"en": "Suppository", "am": "ሱፖዚቶሪ (በፊንጢጣ የሚገባ መድኃኒት)", "bEn": "A small medicine that is placed in the rectum. It melts there.", "bAm": "በፊንጢጣ ውስጥ የሚቀመጥ ትንሽ መድኃኒት ነው። እዚያ ይቀልጣል።"}, {"en": "Constipation", "am": "ሆድ ድርቀት", "bEn": "Stool that is hard and dry and hard to pass. The person may not pass stool often.", "bAm": "ሰገራ ደረቅና ጠንካራ ሆኖ ለመውጣት አስቸጋሪ ሲሆን ነው። ሰውየው ሰገራ አዘውትሮ ላይወጣ ይችላል።"}, {"en": "Incontinence", "am": "ሽንትና ሰገራን መቆጣጠር አለመቻል", "bEn": "Not being able to control urine or stool.", "bAm": "ሽንትን ወይም ሰገራን መቆጣጠር አለመቻል ነው።"}, {"en": "Continence", "am": "ሽንትና ሰገራን መቆጣጠር መቻል", "bEn": "Being able to control urine and stool.", "bAm": "ሽንትንና ሰገራን መቆጣጠር መቻል ነው።"}, {"en": "Urostomy", "am": "ዩሮስቶሚ", "bEn": "Surgery that makes an opening in the belly. Urine leaves the body through this opening.", "bAm": "በሆድ ላይ መክፈቻ የሚሠራ ቀዶ ሕክምና ነው። ሽንት በዚህ መክፈቻ በኩል ከሰውነት ይወጣል።"}, {"en": "Stoma", "am": "ስቶማ (በሆድ ላይ የተሠራ መክፈቻ)", "bEn": "An opening in the belly made by surgery. Urine or stool leaves the body through it.", "bAm": "በቀዶ ሕክምና በሆድ ላይ የሚሠራ መክፈቻ ነው። ሽንት ወይም ሰገራ በዚህ በኩል ይወጣል።"}, {"en": "Colostomy", "am": "ኮሎስቶሚ", "bEn": "Surgery that connects part of the large intestine to a stoma on the belly. Stool leaves through the stoma.", "bAm": "ትልቁን አንጀት በከፊል ከሆድ ላይ ካለ ስቶማ ጋር የሚያገናኝ ቀዶ ሕክምና ነው። ሰገራ በስቶማው በኩል ይወጣል።"}, {"en": "Ileostomy", "am": "ኢሊዮስቶሚ", "bEn": "Surgery that connects the small intestine to a stoma on the belly. Loose stool leaves through the stoma.", "bAm": "ትንሹን አንጀት ከሆድ ላይ ካለ ስቶማ ጋር የሚያገናኝ ቀዶ ሕክምና ነው። ልፍስፍስ ሰገራ በስቶማው በኩል ይወጣል።"}, {"en": "Bedpan", "am": "ቤድፓን (የአልጋ ላይ መጸዳጃ ሳህን)", "bEn": "A pan used to pass urine or stool while lying in bed.", "bAm": "አልጋ ላይ ሆኖ ሽንት ወይም ሰገራ ለመጸዳዳት የሚያገለግል ሳህን ነው።"}, {"en": "Fracture bedpan", "am": "ፍራክቸር ቤድፓን (ለስብራት የሚሆን)", "bEn": "A smaller, flatter bedpan. It is used for people with a broken hip or leg, or who cannot lift their hips.", "bAm": "ትንሽና ጠፍጣፋ ቤድፓን ነው። ዳሌ ወይም እግር ለተሰበረባቸው ወይም ዳሌያቸውን ማንሳት ለማይችሉ ሰዎች ያገለግላል።"}, {"en": "Bedside commode", "am": "ከአልጋ አጠገብ የሚቀመጥ መጸዳጃ ወንበር", "bEn": "A chair with a toilet seat and a bucket. It is placed next to the bed.", "bAm": "የመጸዳጃ መቀመጫና ባልዲ ያለው ወንበር ነው። ከአልጋ አጠገብ ይቀመጣል።"}, {"en": "Urinal", "am": "ዩሪናል (የሽንት መሰብሰቢያ ጠርሙስ)", "bEn": "A container used to collect urine. It is most often used by men.", "bAm": "ሽንት ለመሰብሰብ የሚያገለግል መያዣ ነው። በአብዛኛው በወንዶች ጥቅም ላይ ይውላል።"}, {"en": "Commode hat", "am": "ኮሞድ ሃት (የመጸዳጃ መሰብሰቢያ)", "bEn": "A plastic container that fits under a toilet seat. It collects urine or stool to measure or test.", "bAm": "ከመጸዳጃ መቀመጫ ስር የሚገጠም የፕላስቲክ መያዣ ነው። ሽንት ወይም ሰገራ ለመለካት ወይም ለምርመራ ይሰበስባል።"}, {"en": "Urinary tract infection", "am": "የሽንት ቧንቧ ኢንፌክሽን", "bEn": "An infection in part of the urinary system, like the bladder or kidneys.", "bAm": "በሽንት ሥርዓት ክፍል፣ ለምሳሌ በፊኛ ወይም በኩላሊት የሚከሰት ኢንፌክሽን ነው።"}, {"en": "Catheter associated urinary tract infection", "am": "ከካቴተር ጋር የተያያዘ የሽንት ቧንቧ ኢንፌክሽን", "bEn": "A urinary tract infection caused by a catheter. A catheter is a tube placed in the bladder.", "bAm": "በካቴተር ምክንያት የሚመጣ የሽንት ቧንቧ ኢንፌክሽን ነው። ካቴተር በፊኛ ውስጥ የሚገባ ቱቦ ነው።"}, {"en": "Bladder scanner", "am": "የፊኛ ስካነር", "bEn": "A machine that uses sound waves to show how much urine is in the bladder.", "bAm": "በፊኛ ውስጥ ምን ያህል ሽንት እንዳለ በድምፅ ሞገድ የሚያሳይ ማሽን ነው።"}, {"en": "Occult blood", "am": "ስውር ደም", "bEn": "Blood that is hidden. You cannot see it, but a test can find it.", "bAm": "የተደበቀ ደም ነው። በዓይን አይታይም፣ ግን በምርመራ ይገኛል።"}, {"en": "Frank blood", "am": "የሚታይ ደም", "bEn": "Blood that you can see with your eyes.", "bAm": "በዓይን የሚታይ ደም ነው።"}, {"en": "Bowel and bladder retraining", "am": "የአንጀትና የፊኛ መልሶ ማሰልጠን", "bEn": "A plan to teach the body to control stool and urine again. It uses a set schedule.", "bAm": "ሰውነት ሰገራንና ሽንትን እንደገና እንዲቆጣጠር የሚያስተምር እቅድ ነው። የጊዜ ሰሌዳ ይጠቀማል።"}]}, {"id": "module8", "title": "Module 8 Questions | የሞጁል 8 ጥያቄዎች", "cards": [{"en": "What is the purpose of debridement of a wound?", "am": "የቁስል ዲብራይድመንት ዓላማ ምንድን ነው?", "bEn": "• Debridement removes dead tissue from a wound.<br>• This helps the wound heal.<br>• It lowers the risk of infection.<br>• Nurses or doctors do debridement. A nursing assistant does not.", "bAm": "• ዲብራይድመንት የሞተ ሕብረ ሕዋስን ከቁስል ላይ ማስወገድ ነው።<br>• ቁስሉ እንዲድን ይረዳል።<br>• የኢንፌክሽን አደጋን ይቀንሳል።<br>• ዲብራይድመንትን የሚያደርጉት ነርሶች ወይም ሐኪሞች ናቸው። የነርስ ረዳት አያደርገውም።"}, {"en": "What are the risk factors for residents with mobility issues (immobility)?", "am": "የመንቀሳቀስ ችግር (አለመንቀሳቀስ) ላለባቸው ነዋሪዎች የአደጋ ምክንያቶች ምንድን ናቸው?", "bEn": "A resident who cannot move much is at risk for:<br>• Pressure injuries (bedsores)<br>• Contractures (tight, stiff muscles and joints)<br>• Weak muscles<br>• Blood clots<br>• Pneumonia (lung infection)<br>• Constipation<br>• Urinary tract infections<br>• Feeling sad or lonely", "bAm": "መንቀሳቀስ የማይችል ነዋሪ ለሚከተሉት አደጋዎች ይጋለጣል፦<br>• የግፊት ቁስለት (የአልጋ ቁስል)<br>• ኮንትራክቸር (የጡንቻና የመገጣጠሚያ መጨናነቅና መገተር)<br>• የጡንቻ መድከም<br>• የደም መርጋት<br>• የሳምባ ምች<br>• ሆድ ድርቀት<br>• የሽንት ቧንቧ ኢንፌክሽን<br>• ሐዘንና ብቸኝነት"}, {"en": "Which residents are more susceptible to friction and shearing? What are interventions to prevent friction and shearing?", "am": "ለሰበቃና ለመጎተት በቀላሉ የሚጋለጡት የትኞቹ ነዋሪዎች ናቸው? ሰበቃንና መጎተትን ለመከላከል ምን ማድረግ ይቻላል?", "bEn": "<b>Residents at higher risk<\/b><br>• Residents who cannot move or turn by themselves.<br>• Residents who are very thin, weak, or frail.<br>• Residents with muscle spasms or shaking.<br>• Residents with dry, thin, or fragile skin.<br>• Residents who slide down in the bed or chair.<br>• Residents who are dragged or pulled when moved.<br><br><b>How to prevent friction and shear<\/b><br>• Lift the resident. Do not drag or pull.<br>• Use a draw sheet or slide sheet to move the resident.<br>• Keep the head of the bed as low as allowed. A high bed makes residents slide down.<br>• Keep the skin clean and dry. Use lotion on dry skin.<br>• Keep the sheets smooth. Remove wrinkles and crumbs.<br>• Use heel and elbow protectors.<br>• Change the resident's position at least every 2 hours.<br>• Use friction and shear prevention devices.", "bAm": "<b>ከፍተኛ አደጋ ላይ ያሉ ነዋሪዎች<\/b><br>• በራሳቸው መንቀሳቀስ ወይም መገላበጥ የማይችሉ ነዋሪዎች።<br>• በጣም የከሱ፣ ደካማ ወይም ተሰባሪ ነዋሪዎች።<br>• የጡንቻ መኮማተር ወይም መንቀጥቀጥ ያለባቸው ነዋሪዎች።<br>• ደረቅ፣ ቀጭን ወይም ተሰባሪ ቆዳ ያላቸው ነዋሪዎች።<br>• በአልጋ ወይም በወንበር ላይ ወደ ታች የሚንሸራተቱ ነዋሪዎች።<br>• ሲንቀሳቀሱ የሚጎተቱ ወይም የሚሳቡ ነዋሪዎች።<br><br><b>ሰበቃንና መጎተትን እንዴት መከላከል ይቻላል<\/b><br>• ነዋሪውን ያንሱ። አይጎትቱ ወይም አይሳቡ።<br>• ነዋሪውን ለማንቀሳቀስ የመሳቢያ ሉህ ወይም የመንሸራተቻ ሉህ ይጠቀሙ።<br>• የአልጋውን ራስጌ በሚፈቀደው መጠን ዝቅ አድርገው ያቆዩ። ከፍ ያለ አልጋ ነዋሪውን ወደ ታች ያንሸራትታል።<br>• ቆዳውን ንጹሕና ደረቅ ያድርጉ። ለደረቀ ቆዳ ሎሽን ይጠቀሙ።<br>• አንሶላውን ለስላሳ ያድርጉ። ስብስቦችንና ፍርፋሪዎችን ያስወግዱ።<br>• የተረከዝና የክርን መከላከያዎችን ይጠቀሙ።<br>• የነዋሪውን አቀማመጥ ቢያንስ በየ2 ሰዓቱ ይቀይሩ።<br>• ሰበቃንና መጎተትን መከላከያ መሣሪያዎችን ይጠቀሙ።"}, {"en": "Define pressure ulcers and describe the four stages of pressure ulcers.", "am": "የግፊት ቁስለትን ግለጹ፤ አራቱን ደረጃዎችም ግለጹ።", "bEn": "A pressure ulcer is damage to the skin and tissue. It is caused by pressure on one area for a long time. It is also called a bedsore.<br><br><b>Stage 1<\/b><br>The skin is not broken. The area is red and does not turn white when pressed. It may feel warm, hard, or painful. On dark skin it may look darker or purple.<br><br><b>Stage 2<\/b><br>The top layer of skin is lost. There is a shallow open sore or a blister. It looks like a scrape.<br><br><b>Stage 3<\/b><br>The sore is deeper. It goes through the skin into the fat. It looks like a crater. Muscle and bone cannot be seen.<br><br><b>Stage 4<\/b><br>The sore is very deep. Muscle, tendon, or bone can be seen. There may be black or yellow dead tissue.<br>Report any red area on the skin to the nurse right away.", "bAm": "የግፊት ቁስለት በቆዳና በሕብረ ሕዋስ ላይ የሚደርስ ጉዳት ነው። የሚከሰተው በአንድ ቦታ ላይ ለረጅም ጊዜ በሚደርስ ጫና ነው። የአልጋ ቁስል ተብሎም ይጠራል።<br><br><b>ደረጃ 1<\/b><br>ቆዳው አልተቀደደም። ቦታው ቀይ ሲሆን ሲጫኑት አይነጣም። ሞቅ ያለ፣ ጠንካራ ወይም የሚያም ሊሆን ይችላል። ጠየም ባለ ቆዳ ላይ ጠቆር ያለ ወይም ሐምራዊ ሊመስል ይችላል።<br><br><b>ደረጃ 2<\/b><br>የቆዳው የላይኛው ንብርብር ጠፍቷል። ጥልቀት የሌለው ክፍት ቁስል ወይም ዕብጠት (ብጉንጅ) አለ። መፋቅ ይመስላል።<br><br><b>ደረጃ 3<\/b><br>ቁስሉ ጠልቋል። ቆዳውን አልፎ ወደ ስብ ይደርሳል። ጉድጓድ ይመስላል። ጡንቻና አጥንት አይታዩም።<br><br><b>ደረጃ 4<\/b><br>ቁስሉ በጣም ጥልቅ ነው። ጡንቻ፣ ጅማት ወይም አጥንት ይታያል። ጥቁር ወይም ቢጫ የሞተ ሕብረ ሕዋስ ሊኖር ይችላል።<br>በቆዳ ላይ ማንኛውንም ቀይ ቦታ ካዩ ወዲያውኑ ለነርሷ/ለነርሱ ሪፖርት ያድርጉ።"}, {"en": "What is the procedure for male and female peri-care?", "am": "የወንድና የሴት የብልት አካባቢ (ፔሪ) እንክብካቤ አሠራር ምንድን ነው?", "bEn": "<b>Before you start (male and female)<\/b><br>1. Wash your hands and put on gloves.<br>2. Explain what you will do. Close the door or curtain for privacy.<br>3. Check that the water is warm and comfortable.<br>4. Help the resident lie on their back. Cover them with a bath blanket. Expose only the private area.<br>5. Place a waterproof pad under the hips.<br><br><b>Female<\/b><br>1. Wash from front to back. Use a clean part of the washcloth for each stroke.<br>2. Separate the labia. Wash down the middle, then each side.<br>3. Rinse the same way, front to back. Pat dry from front to back.<br>4. Turn the resident on their side. Wash the rectal area from front to back. Rinse and dry.<br><br><b>Male<\/b><br>1. Hold the penis gently. Wash the tip in a circle. Start at the opening and move outward.<br>2. Wash down the shaft toward the body. Use a clean part of the cloth each time.<br>3. Wash the scrotum and the skin folds of the groin. Rinse and dry.<br>4. Turn the resident on their side. Wash the rectal area from front to back. Rinse and dry.<br><br><b>At the end (male and female)<\/b><br>1. Remove the wet pad. Cover the resident and make them comfortable.<br>2. Remove your gloves and wash your hands.<br>3. Report redness, sores, rash, swelling, or drainage to the nurse.", "bAm": "<b>ከመጀመርዎ በፊት (ወንድና ሴት)<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ።<br>2. የሚያደርጉትን ያስረዱ። ለግላዊነት በሩን ወይም መጋረጃውን ይዝጉ።<br>3. ውሃው ሞቅ ያለና ምቹ መሆኑን ያረጋግጡ።<br>4. ነዋሪው በጀርባው እንዲተኛ ይርዱት። በገላ መሸፈኛ ብርድ ልብስ ይሸፍኑት። የግል አካባቢውን ብቻ ይግለጡ።<br>5. ከዳሌው በታች ውሃ የማያስተላልፍ ፓድ ያድርጉ።<br><br><b>ሴት<\/b><br>1. ከፊት ወደ ኋላ ይታጠቡ። ለእያንዳንዱ ጊዜ የጨርቁን ንጹሕ ክፍል ይጠቀሙ።<br>2. የብልት ከንፈሮችን ይለያዩ። መሃሉን ከዚያም እያንዳንዱን ጎን ወደ ታች ይታጠቡ።<br>3. በተመሳሳይ መንገድ ከፊት ወደ ኋላ ያጥቡ። ከፊት ወደ ኋላ ደረቅ አድርገው ያፍሱ።<br>4. ነዋሪውን ወደ ጎኑ ያዙሩት። የፊንጢጣ አካባቢን ከፊት ወደ ኋላ ይታጠቡ። ያጥቡና ያደርቁ።<br><br><b>ወንድ<\/b><br>1. የወንድ ብልትን በቀስታ ይያዙ። ጫፉን በክብ እንቅስቃሴ ይታጠቡ። ከመክፈቻው ጀምረው ወደ ውጭ ይሂዱ።<br>2. ሰውነቱ ወዳለበት አቅጣጫ ግንዱን ወደ ታች ይታጠቡ። ለእያንዳንዱ ጊዜ የጨርቁን ንጹሕ ክፍል ይጠቀሙ።<br>3. የቆለጥ ከረጢቱንና የጭን መገናኛ የቆዳ እጥፋቶችን ይታጠቡ። ያጥቡና ያደርቁ።<br>4. ነዋሪውን ወደ ጎኑ ያዙሩት። የፊንጢጣ አካባቢን ከፊት ወደ ኋላ ይታጠቡ። ያጥቡና ያደርቁ።<br><br><b>በመጨረሻ (ወንድና ሴት)<\/b><br>1. እርጥብ ፓዱን ያውጡ። ነዋሪውን ይሸፍኑና ምቹ ያድርጉት።<br>2. ጓንትዎን አውልቀው እጅዎን ይታጠቡ።<br>3. መቅላት፣ ቁስል፣ ሽፍታ፣ እብጠት ወይም ፈሳሽ ካዩ ለነርሷ/ለነርሱ ሪፖርት ያድርጉ።"}, {"en": "What is the procedure for nail and foot care?", "am": "የጥፍርና የእግር እንክብካቤ አሠራር ምንድን ነው?", "bEn": "<b>Nail care<\/b><br>1. Wash your hands and put on gloves. Explain what you will do.<br>2. Soak the resident's hands in warm water for 5 to 10 minutes.<br>3. Clean under each nail with an orange stick.<br>4. Dry the hands well.<br>5. File the nails with an emery board. Make them smooth and follow the curve of the finger.<br>6. Put lotion on the hands.<br><br><b>Foot care<\/b><br>1. Soak the feet in a basin of warm water for 5 to 10 minutes.<br>2. Wash the feet. Wash well between the toes.<br>3. Dry the feet well. Dry between the toes too.<br>4. Look for redness, cuts, sores, blisters, or swelling. Report them.<br>5. Put lotion on the tops and bottoms of the feet. Do not put lotion between the toes.<br>6. Put on clean socks and shoes that fit.<br><br><b>Important<\/b><br>1. Do not cut the nails of a resident with diabetes or poor blood flow. Ask the nurse.<br>2. Wash your hands when you finish.", "bAm": "<b>የጥፍር እንክብካቤ<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ።<br>2. የነዋሪውን እጆች ከ5 እስከ 10 ደቂቃ በሞቀ ውሃ ውስጥ ያጠቡ።<br>3. ከእያንዳንዱ ጥፍር ስር በብርቱካናማ እንጨት (ኦሬንጅ ስቲክ) ያጽዱ።<br>4. እጆቹን በደንብ ያደርቁ።<br>5. ጥፍሮቹን በኢመሪ ቦርድ (የጥፍር መሞረጃ) ይሞርዱ። ለስላሳ ያድርጓቸው፤ የጣቱን ቅርጽ ይከተሉ።<br>6. በእጆቹ ላይ ሎሽን ይቀቡ።<br><br><b>የእግር እንክብካቤ<\/b><br>1. እግሮቹን ከ5 እስከ 10 ደቂቃ በሞቀ ውሃ በተሞላ ገንዳ ውስጥ ያጠቡ።<br>2. እግሮቹን ይታጠቡ። በጣቶች መካከል በደንብ ይታጠቡ።<br>3. እግሮቹን በደንብ ያደርቁ። በጣቶች መካከልም ያደርቁ።<br>4. መቅላት፣ መቆረጥ፣ ቁስል፣ ብጉንጅ ወይም እብጠት ካለ ይመልከቱ። ሪፖርት ያድርጉ።<br>5. በእግር የላይኛውና የታችኛው ክፍል ላይ ሎሽን ይቀቡ። በጣቶች መካከል ሎሽን አይቀቡ።<br>6. ንጹሕ ካልሲና የሚስማማ ጫማ ያድርጉለት።<br><br><b>አስፈላጊ<\/b><br>1. የስኳር በሽታ ወይም ደካማ የደም ዝውውር ያለበትን ነዋሪ ጥፍር አይቁረጡ። ነርሷን/ነርሱን ይጠይቁ።<br>2. ሲጨርሱ እጅዎን ይታጠቡ።"}, {"en": "What is the procedure for shaving? What is the procedure for shaving a resident who is taking anticoagulants?", "am": "የመላጨት አሠራር ምንድን ነው? ደም መርጋትን የሚከላከል መድኃኒት (አንቲኮዋጉላንት) የሚወስድ ነዋሪ እንዴት ይላጫል?", "bEn": "<b>Shaving<\/b><br>1. Wash your hands and put on gloves. Explain what you will do. Give privacy.<br>2. Put a towel over the resident's chest.<br>3. Wipe the face with a warm, wet washcloth to soften the hair.<br>4. Safety razor: put shaving cream on the face. Hold the skin tight. Shave with short strokes in the direction the hair grows.<br>5. Electric razor: follow the maker's directions. Shave gently.<br>6. Rinse and dry the face. Put on aftershave if the resident wants it.<br>7. Clean the razor. Put a used blade in the sharps container.<br>8. Report any cuts, bumps, or sores.<br><br><b>Resident on anticoagulants (blood thinners)<\/b><br>1. Use only an electric razor. Never use a safety razor or a blade.<br>2. Shave very gently. These residents bleed easily.<br>3. If there is a cut or bleeding, press on it with a clean cloth. Tell the nurse right away.", "bAm": "<b>መላጨት<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>2. በነዋሪው ደረት ላይ ፎጣ ያድርጉ።<br>3. ፀጉሩን ለማለስለስ ፊቱን በሞቀ እርጥብ ጨርቅ ይጥረጉ።<br>4. የደህንነት ምላጭ (ሴፍቲ ሬዘር)፦ ፊቱ ላይ የመላጫ ክሬም ይቀቡ። ቆዳውን ያወጥሩ። ፀጉሩ በሚበቅልበት አቅጣጫ በአጫጭር ጭረቶች ይላጩ።<br>5. የኤሌክትሪክ ምላጭ፦ የአምራቹን መመሪያ ይከተሉ። በቀስታ ይላጩ።<br>6. ፊቱን ያጥቡና ያደርቁ። ነዋሪው ከፈለገ አፍተር ሼቭ ይጠቀሙ።<br>7. ምላጩን ያጽዱ። ያገለገለ ምላጭ ካለ በሹል ዕቃ መጣያ ውስጥ ይጣሉት።<br>8. ማንኛውም መቆረጥ፣ እብጠት ወይም ቁስል ካለ ሪፖርት ያድርጉ።<br><br><b>ደም መርጋትን የሚከላከል መድኃኒት (አንቲኮዋጉላንት) የሚወስድ ነዋሪ<\/b><br>1. የኤሌክትሪክ ምላጭ ብቻ ይጠቀሙ። የደህንነት ምላጭ ወይም ስለት በጭራሽ አይጠቀሙ።<br>2. በጣም በቀስታ ይላጩ። እነዚህ ነዋሪዎች በቀላሉ ደም ይፈሳቸዋል።<br>3. መቆረጥ ወይም ደም መፍሰስ ካለ በንጹሕ ጨርቅ ይጫኑት። ወዲያውኑ ለነርሷ/ለነርሱ ይንገሩ።"}, {"en": "What is the procedure for mouth care and denture care?", "am": "የአፍና የሰው ሠራሽ ጥርስ እንክብካቤ አሠራር ምንድን ነው?", "bEn": "<b>Mouth care (natural teeth)<\/b><br>1. Wash your hands and put on gloves. Explain what you will do.<br>2. Help the resident sit up. Put a towel on the chest.<br>3. Wet the toothbrush. Put a small amount of toothpaste on it.<br>4. Brush the teeth, gums, and tongue gently.<br>5. Give water to rinse. Hold a basin under the chin so the resident can spit.<br>6. Wipe the mouth. Put lip balm on the lips.<br>7. Report bleeding, sores, loose teeth, or pain.<br><br><b>Denture care<\/b><br>1. Put a towel in the sink or fill the sink with water. This stops the dentures from breaking if dropped.<br>2. Remove the dentures with gauze. Take out the top first, then the bottom.<br>3. Put the dentures in a denture cup.<br>4. Brush all sides of the dentures with a denture brush and cleaner. Use cool water. Never use hot water.<br>5. Rinse the dentures well.<br>6. Brush the resident's gums and tongue. Let them rinse.<br>7. Put the dentures back in the mouth, or store them in a labeled cup with cool water.<br>8. Report cracked or lost dentures.", "bAm": "<b>የአፍ እንክብካቤ (የተፈጥሮ ጥርሶች)<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ።<br>2. ነዋሪው ቀና ብሎ እንዲቀመጥ ይርዱት። በደረቱ ላይ ፎጣ ያድርጉ።<br>3. የጥርስ ብሩሽን ያርጥቡ። ትንሽ የጥርስ ሳሙና ይቀቡበት።<br>4. ጥርሶችን፣ ድድንና ምላስን በቀስታ ይቦርሹ።<br>5. ለማጉመጥመጥ ውሃ ይስጡት። ለመትፋት ከአገጩ ስር ገንዳ ይያዙ።<br>6. አፉን ይጥረጉ። በከንፈሮቹ ላይ የከንፈር ቅባት ይቀቡ።<br>7. ደም መፍሰስ፣ ቁስል፣ የላሉ ጥርሶች ወይም ህመም ካለ ሪፖርት ያድርጉ።<br><br><b>የሰው ሠራሽ ጥርስ እንክብካቤ<\/b><br>1. በመታጠቢያ ገንዳው ውስጥ ፎጣ ያድርጉ ወይም ገንዳውን በውሃ ይሙሉ። ጥርሶቹ ቢወድቁ እንዳይሰበሩ ይረዳል።<br>2. ሰው ሠራሽ ጥርሶቹን በጋዝ አውጡ። መጀመሪያ የላይኛውን ከዚያ የታችኛውን ያውጡ።<br>3. ጥርሶቹን በሰው ሠራሽ ጥርስ መያዣ ኩባያ ውስጥ ያድርጉ።<br>4. የጥርሶቹን ሁሉንም ጎኖች በሰው ሠራሽ ጥርስ ብሩሽና ማጽጃ ይቦርሹ። ቀዝቃዛ ውሃ ይጠቀሙ። ሞቃት ውሃ በጭራሽ አይጠቀሙ።<br>5. ጥርሶቹን በደንብ ያጥቡ።<br>6. የነዋሪውን ድድና ምላስ ይቦርሹ። እንዲያጉመጠምጥ ያድርጉ።<br>7. ጥርሶቹን ወደ አፉ መልሰው ያስገቡ፤ ወይም ስም በተጻፈበት ቀዝቃዛ ውሃ ባለው ኩባያ ውስጥ ያስቀምጡ።<br>8. የተሰነጠቀ ወይም የጠፋ ጥርስ ካለ ሪፖርት ያድርጉ።"}, {"en": "How many times should a nursing assistant perform mouth care and denture care on a resident?", "am": "የነርስ ረዳት ለአንድ ነዋሪ የአፍና የሰው ሠራሽ ጥርስ እንክብካቤ ምን ያህል ጊዜ ማድረግ ይኖርበታል?", "bEn": "• Mouth care: at least 2 times a day. Do it in the morning and at bedtime.<br>• Do mouth care after meals too, if the resident needs it.<br>• Dentures: clean them at least 1 time a day. Clean them after meals if needed.<br>• Dentures are usually taken out at night and stored in cool water.<br>• Follow the care plan and the facility rules.", "bAm": "• የአፍ እንክብካቤ፦ በቀን ቢያንስ 2 ጊዜ። ጠዋትና ከመተኛት በፊት ያድርጉ።<br>• ነዋሪው ከፈለገ ከምግብ በኋላም የአፍ እንክብካቤ ያድርጉ።<br>• ሰው ሠራሽ ጥርሶች፦ በቀን ቢያንስ 1 ጊዜ ያጽዱ። ካስፈለገ ከምግብ በኋላም ያጽዱ።<br>• ሰው ሠራሽ ጥርሶች በአብዛኛው በሌሊት ይወጣሉ፤ በቀዝቃዛ ውሃም ይቀመጣሉ።<br>• የእንክብካቤ ዕቅዱንና የተቋሙን ደንብ ይከተሉ።"}, {"en": "What is the procedure for colostomy and catheter care?", "am": "የኮሎስቶሚና የካቴተር እንክብካቤ አሠራር ምንድን ነው?", "bEn": "<b>Colostomy care<\/b><br>1. Wash your hands and put on gloves. Explain what you will do. Give privacy.<br>2. Empty the bag when it is one-third to one-half full.<br>3. Clean the skin around the stoma with warm water and mild soap. Pat it dry.<br>4. Look at the stoma. It should be pink or red and moist.<br>5. Look at the skin around it for redness, sores, or rash.<br>6. Report a stoma that is dark, blue, or black. Also report bleeding, a bad smell, or skin problems.<br>7. Change the bag only if your facility allows it.<br><br><b>Catheter care<\/b><br>1. Wash your hands and put on gloves. Explain what you will do. Give privacy.<br>2. Do peri-care first.<br>3. Hold the catheter near the opening so it does not pull.<br>4. Clean the catheter tube with soap and water. Start at the opening and wipe away from the body, about 4 inches.<br>5. Use a clean part of the cloth for each stroke. Rinse and dry.<br>6. Keep the bag lower than the bladder. Do not let the bag touch the floor.<br>7. Keep the tube straight with no kinks. Secure it to the resident's leg.<br>8. Report blood in the urine, cloudy or bad-smelling urine, no urine, leaking, or pain.", "bAm": "<b>የኮሎስቶሚ እንክብካቤ<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>2. ቦርሳው አንድ ሦስተኛ እስከ ግማሽ ሲሞላ ባዶ ያድርጉት።<br>3. በስቶማው ዙሪያ ያለውን ቆዳ በሞቀ ውሃና በለስላሳ ሳሙና ያጽዱ። በቀስታ ያደርቁት።<br>4. ስቶማውን ይመልከቱ። ሮዝ ወይም ቀይና እርጥብ መሆን አለበት።<br>5. በዙሪያው ያለውን ቆዳ መቅላት፣ ቁስል ወይም ሽፍታ ካለ ይመልከቱ።<br>6. ስቶማው ጠቆር ያለ፣ ሰማያዊ ወይም ጥቁር ከሆነ ሪፖርት ያድርጉ። ደም መፍሰስ፣ መጥፎ ሽታ ወይም የቆዳ ችግር ካለም ሪፖርት ያድርጉ።<br>7. ቦርሳውን የሚቀይሩት የተቋሙ ደንብ ከፈቀደ ብቻ ነው።<br><br><b>የካቴተር እንክብካቤ<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>2. መጀመሪያ የብልት አካባቢ (ፔሪ) እንክብካቤ ያድርጉ።<br>3. እንዳይሳብ ካቴተሩን ከመክፈቻው አጠገብ ይያዙ።<br>4. የካቴተሩን ቱቦ በሳሙናና በውሃ ያጽዱ። ከመክፈቻው ጀምረው ከሰውነት ራቅ ብለው ወደ 4 ኢንች ያህል ይጥረጉ።<br>5. ለእያንዳንዱ ጊዜ የጨርቁን ንጹሕ ክፍል ይጠቀሙ። ያጥቡና ያደርቁ።<br>6. ቦርሳውን ከፊኛ በታች ያድርጉት። ቦርሳው መሬት እንዲነካ አይፍቀዱ።<br>7. ቱቦው ቀጥ ያለና ያልታጠፈ ይሁን። ከነዋሪው እግር ጋር ያያይዙት።<br>8. በሽንት ውስጥ ደም፣ የደፈረሰ ወይም መጥፎ ሽታ ያለው ሽንት፣ ሽንት አለመኖር፣ መፍሰስ ወይም ህመም ካለ ሪፖርት ያድርጉ።"}, {"en": "What is the procedure for applying hearing aids?", "am": "የመስሚያ መርጃ (ሄሪንግ ኤይድ) የማድረግ አሠራር ምንድን ነው?", "bEn": "1. Wash your hands. Explain what you will do.<br>2. Check that the ear is clean. Tell the nurse about a lot of wax or drainage.<br>3. Check that the battery is working.<br>4. Find the right and left aids. Red is usually the right ear. Blue is usually the left ear.<br>5. Turn the hearing aid off, or turn the volume down low.<br>6. Hold the aid so the curved part follows the shape of the ear. Gently place it in the ear.<br>7. Turn it on. Slowly turn up the volume until the resident can hear you.<br>8. If it whistles, it may not fit right. Fix the fit or turn the volume down.<br>9. Speak to the resident to check that they can hear.<br>10. Report problems to the nurse.", "bAm": "1. እጅዎን ይታጠቡ። የሚያደርጉትን ያስረዱ።<br>2. ጆሮው ንጹሕ መሆኑን ያረጋግጡ። ብዙ የጆሮ ኩክ ወይም ፈሳሽ ካለ ለነርሷ/ለነርሱ ይንገሩ።<br>3. ባትሪው እየሠራ መሆኑን ያረጋግጡ።<br>4. የቀኝና የግራ መርጃዎችን ይለዩ። ቀይ በአብዛኛው የቀኝ ጆሮ ነው። ሰማያዊ በአብዛኛው የግራ ጆሮ ነው።<br>5. መርጃውን ያጥፉት፤ ወይም ድምፁን ዝቅ ያድርጉት።<br>6. የተጠማዘዘው ክፍል የጆሮውን ቅርጽ እንዲከተል መርጃውን ይያዙ። በቀስታ ጆሮ ውስጥ ያስገቡት።<br>7. ያብሩት። ነዋሪው እስኪሰማዎት ድረስ ድምፁን ቀስ በቀስ ከፍ ያድርጉ።<br>8. ካፏጨ በትክክል አልገባ ይሆናል። አገጣጠሙን ያስተካክሉ ወይም ድምፁን ዝቅ ያድርጉ።<br>9. እንደሚሰማ ለማረጋገጥ ነዋሪውን ያነጋግሩት።<br>10. ችግር ካለ ለነርሷ/ለነርሱ ሪፖርት ያድርጉ።"}, {"en": "What do you need to report to the charge nurse after providing care to the resident?", "am": "ለነዋሪው እንክብካቤ ከሰጡ በኋላ ለኃላፊ ነርስ ምን ሪፖርት ማድረግ አለብዎት?", "bEn": "• Any skin changes: redness, rash, sores, bruises, cuts, or swelling.<br>• Bleeding, or a change in the color of a stoma.<br>• Unusual urine or stool: blood, cloudy, bad smell, or a change in amount.<br>• Pain or discomfort.<br>• Changes in mood or behavior.<br>• Changes in what the resident can do.<br>• If the resident refused care.<br>• Problems with equipment: hearing aids, dentures, prosthesis, or catheter.<br>• Anything unusual that you saw.", "bAm": "• ማንኛውም የቆዳ ለውጥ፦ መቅላት፣ ሽፍታ፣ ቁስል፣ ስብራት (የደም መቁሰል)፣ መቆረጥ ወይም እብጠት።<br>• ደም መፍሰስ፣ ወይም የስቶማ ቀለም ለውጥ።<br>• ያልተለመደ ሽንት ወይም ሰገራ፦ ደም፣ የደፈረሰ፣ መጥፎ ሽታ ወይም የመጠን ለውጥ።<br>• ህመም ወይም ምቾት ማጣት።<br>• የስሜት ወይም የባህሪ ለውጥ።<br>• ነዋሪው ማድረግ በሚችላቸው ነገሮች ላይ የተከሰተ ለውጥ።<br>• ነዋሪው እንክብካቤን ከከለከለ።<br>• በመሣሪያዎች ላይ ያሉ ችግሮች፦ የመስሚያ መርጃ፣ ሰው ሠራሽ ጥርስ፣ ሰው ሠራሽ የአካል ክፍል ወይም ካቴተር።<br>• ያዩት ማንኛውም ያልተለመደ ነገር።"}, {"en": "What is the procedure for dressing a resident with right-side weakness?", "am": "የቀኝ ጎን ድክመት ያለበትን ነዋሪ የማልበስ አሠራር ምንድን ነው?", "bEn": "• Wash your hands. Explain what you will do. Give privacy.<br>• Let the resident choose the clothes. Let them do as much as they can.<br>• Help the resident sit if they can. Cover them with a blanket.<br><br><b>Undressing<\/b><br>• Take the clothes off the strong side (left) first.<br>• Then take them off the weak side (right).<br><br><b>Dressing<\/b><br>• Put the clothes on the weak side (right) first.<br>• Then put them on the strong side (left).<br>• Support the weak arm and leg. Never pull on them.<br>• Put on socks and shoes that fit. Make the resident comfortable.<br>Remember: strong side out first. Weak side in first.", "bAm": "• እጅዎን ይታጠቡ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>• ነዋሪው ልብሱን ራሱ ይምረጥ። የሚችለውን ያህል እንዲያደርግ ይፍቀዱለት።<br>• ከቻለ ነዋሪው እንዲቀመጥ ይርዱት። በብርድ ልብስ ይሸፍኑት።<br><br><b>ማውለቅ<\/b><br>• መጀመሪያ ከጠንካራው ጎን (ግራ) ልብሱን ያውልቁ።<br>• ከዚያ ከደካማው ጎን (ቀኝ) ያውልቁ።<br><br><b>ማልበስ<\/b><br>• መጀመሪያ ደካማው ጎን (ቀኝ) ላይ ልብሱን ያልብሱ።<br>• ከዚያ ጠንካራው ጎን (ግራ) ላይ ያልብሱ።<br>• ደካማውን ክንድና እግር ደግፈው ይያዙ። በጭራሽ አይጎትቷቸው።<br>• የሚስማማ ካልሲና ጫማ ያድርጉለት። ነዋሪውን ምቹ ያድርጉት።<br>ያስታውሱ፦ ማውለቅ ከጠንካራው ጎን ይጀምራል። ማልበስ ከደካማው ጎን ይጀምራል።"}, {"en": "How often do you perform a routine partial bath?", "am": "መደበኛ ከፊል ገላ መታጠብ ምን ያህል ጊዜ ይደረጋል?", "bEn": "• A partial bath is usually done every day, or as the care plan says.<br>• It washes the face, hands, underarms, back, and private area.<br>• A full bath, shower, or tub bath is done less often. Follow the care plan and the resident's choice.", "bAm": "• ከፊል ገላ መታጠብ በአብዛኛው በየቀኑ ወይም የእንክብካቤ ዕቅዱ እንደሚለው ይደረጋል።<br>• ፊትን፣ እጆችን፣ ብብትን፣ ጀርባንና የግል አካባቢን ያጥባል።<br>• ሙሉ ገላ መታጠብ፣ ሻወር ወይም የገንዳ መታጠብ በጥቂት ጊዜ ይደረጋል። የእንክብካቤ ዕቅዱንና የነዋሪውን ምርጫ ይከተሉ።"}, {"en": "How often do you shampoo a resident's hair, and what are the different ways you can shampoo their hair?", "am": "የነዋሪውን ፀጉር ምን ያህል ጊዜ በሻምፖ መታጠብ ይገባል? ፀጉርን በሻምፖ ለመታጠብ የተለያዩ መንገዶች ምንድን ናቸው?", "bEn": "<b>How often<\/b><br>• Usually once a week, or as the care plan says.<br>• Shampoo more often if the hair is dirty or greasy.<br><br><b>Ways to shampoo<\/b><br>• In the shower or tub.<br>• In bed, with a shampoo tray and a basin.<br>• At the sink, with the resident leaning back.<br>• With a no-rinse shampoo cap. This is good for residents who cannot get wet.<br>Check the care plan first. Tell the nurse about any sores on the scalp.", "bAm": "<b>ምን ያህል ጊዜ<\/b><br>• በአብዛኛው በሳምንት አንድ ጊዜ፣ ወይም የእንክብካቤ ዕቅዱ እንደሚለው።<br>• ፀጉሩ ከቆሸሸ ወይም ከዘይት ከበዛበት ብዙ ጊዜ ይታጠቡ።<br><br><b>የሻምፖ አጣጠብ መንገዶች<\/b><br>• በሻወር ወይም በገንዳ ውስጥ።<br>• በአልጋ ላይ፣ በሻምፖ ማጠቢያ ትሪና ገንዳ።<br>• በመታጠቢያ ገንዳ ላይ፣ ነዋሪው ወደ ኋላ ተደግፎ።<br>• ማጠብ በማያስፈልገው የሻምፖ ቆብ (ኖ-ሪንስ)። መርጠብ ለማይችሉ ነዋሪዎች ጥሩ ነው።<br>መጀመሪያ የእንክብካቤ ዕቅዱን ይመልከቱ። በራስ ቆዳ ላይ ቁስል ካለ ለነርሷ/ለነርሱ ይንገሩ።"}, {"en": "Explain bowel and bladder retraining.", "am": "የአንጀትና የፊኛ መልሶ ማሰልጠንን ያብራሩ።", "bEn": "• It is a plan to help a resident control stool and urine again.<br>• Take the resident to the toilet at set times. For example: after waking, after meals, every 2 hours, and before bed.<br>• Give privacy and enough time. Do not rush.<br>• Offer fluids and fiber foods, unless the resident is on limits.<br>• Write down when the resident goes and when accidents happen.<br>• Praise the resident. Be kind if there is an accident.<br>• Tell the nurse how it is going.", "bAm": "• ነዋሪው ሰገራንና ሽንትን እንደገና እንዲቆጣጠር የሚረዳ ዕቅድ ነው።<br>• ነዋሪውን በተወሰኑ ሰዓታት ወደ መጸዳጃ ይውሰዱት። ለምሳሌ፦ ከእንቅልፍ ሲነቃ፣ ከምግብ በኋላ፣ በየ2 ሰዓቱና ከመተኛት በፊት።<br>• ግላዊነት ይስጡ፤ በቂ ጊዜም ይስጡ። አያቻኩሉት።<br>• ገደብ ከሌለበት ፈሳሽና ፋይበር ያለው ምግብ ያቅርቡለት።<br>• ነዋሪው መቼ እንደሚጸዳዳና መቼ አደጋ እንደሚደርስ ይመዝግቡ።<br>• ነዋሪውን ያመስግኑት። አደጋ ቢደርስ ደግ ይሁኑ።<br>• እንዴት እየሄደ እንደሆነ ለነርሷ/ለነርሱ ይንገሩ።"}, {"en": "What is the procedure for weighing and measuring the resident?", "am": "ነዋሪውን የመመዘንና ቁመቱን የመለካት አሠራር ምንድን ነው?", "bEn": "<b>Weighing<\/b><br>1. Wash your hands. Explain what you will do.<br>2. Weigh at the same time each day. Best is before breakfast, after the resident uses the toilet.<br>3. Use the same scale. The resident wears light clothes and no shoes.<br>4. Set the scale to zero.<br>5. Help the resident stand on the scale. Hold their arm if needed.<br>6. Read the weight. On a balance scale, move the weights until the bar is level.<br>7. Help the resident down. Write down the weight. Wash your hands.<br><br><b>Measuring height<\/b><br>1. The resident stands straight with no shoes. Use the measuring bar on the scale.<br>2. If the resident cannot stand, lay them flat in bed and measure with a tape.<br>3. Write down the height.<br>4. Report big changes in weight to the nurse.", "bAm": "<b>መመዘን<\/b><br>1. እጅዎን ይታጠቡ። የሚያደርጉትን ያስረዱ።<br>2. በየቀኑ በተመሳሳይ ሰዓት ይመዝኑ። ምርጡ ከቁርስ በፊት፣ ነዋሪው መጸዳጃ ከተጠቀመ በኋላ ነው።<br>3. ተመሳሳዩን ሚዛን ይጠቀሙ። ነዋሪው ቀላል ልብስ ለብሶ ጫማ ሳያደርግ ይመዘን።<br>4. ሚዛኑን ወደ ዜሮ ያስተካክሉ።<br>5. ነዋሪው ሚዛኑ ላይ እንዲቆም ይርዱት። ካስፈለገ ክንዱን ይያዙ።<br>6. ክብደቱን ያንብቡ። በሚዛን ዘንግ ላይ ዘንጉ እስኪስተካከል ድረስ ክብደቶቹን ያንቀሳቅሱ።<br>7. ነዋሪው እንዲወርድ ይርዱት። ክብደቱን ይጻፉ። እጅዎን ይታጠቡ።<br><br><b>ቁመት መለካት<\/b><br>1. ነዋሪው ጫማ ሳያደርግ ቀጥ ብሎ ይቁም። በሚዛኑ ላይ ያለውን መለኪያ ዘንግ ይጠቀሙ።<br>2. መቆም ካልቻለ አልጋ ላይ በጀርባው ያስተኙትና በቴፕ ይለኩ።<br>3. ቁመቱን ይጻፉ።<br>4. ትልቅ የክብደት ለውጥ ካለ ለነርሷ/ለነርሱ ሪፖርት ያድርጉ።"}, {"en": "Why is good skin care so important?", "am": "ጥሩ የቆዳ እንክብካቤ ለምን አስፈላጊ ነው?", "bEn": "• Skin protects the body from germs and injury.<br>• Older skin is thin and breaks easily.<br>• Good skin care prevents pressure injuries and infections.<br>• It helps you find problems early.<br>• It helps the resident feel clean and comfortable.", "bAm": "• ቆዳ ሰውነትን ከጀርሞችና ከጉዳት ይጠብቃል።<br>• የአረጋውያን ቆዳ ቀጭን ሲሆን በቀላሉ ይሰበራል።<br>• ጥሩ የቆዳ እንክብካቤ የግፊት ቁስለትንና ኢንፌክሽንን ይከላከላል።<br>• ችግሮችን ቀድመው እንዲያገኙ ይረዳል።<br>• ነዋሪው ንጹሕና ምቾት እንዲሰማው ይረዳል።"}, {"en": "What is the function of the skin?", "am": "የቆዳ ተግባር ምንድን ነው?", "bEn": "• It protects the body from germs and injury.<br>• It helps keep body temperature normal. Sweat cools the body.<br>• It feels touch, pain, heat, and cold.<br>• It holds water in the body.<br>• It helps make vitamin D.<br>• It gets rid of some waste through sweat.", "bAm": "• ሰውነትን ከጀርሞችና ከጉዳት ይጠብቃል።<br>• የሰውነትን ሙቀት መደበኛ ለማድረግ ይረዳል። ላብ ሰውነትን ያቀዘቅዛል።<br>• ንክኪን፣ ህመምን፣ ሙቀትንና ቅዝቃዜን ይሰማል።<br>• ውሃን በሰውነት ውስጥ ይይዛል።<br>• ቫይታሚን ዲ ለመሥራት ይረዳል።<br>• በላብ አማካኝነት የተወሰነ ቆሻሻን ያስወግዳል።"}, {"en": "What is the proper procedure for ensuring the water is a comfortable temperature for the resident?", "am": "ውሃው ለነዋሪው ምቹ ሙቀት መሆኑን ለማረጋገጥ ትክክለኛው አሠራር ምንድን ነው?", "bEn": "• Use a bath thermometer. Bath water is usually 105°F to 115°F (about 40°C to 46°C). Follow the facility rules.<br>• Turn on the cold water first, then the hot water.<br>• Test the water on the inside of your wrist.<br>• Ask the resident if the water feels comfortable.<br>• Add cold or hot water to fix it. Test again.<br>• Check the water again during the bath.<br>• In a shower, test the water before the resident gets in.", "bAm": "• የመታጠቢያ ውሃ መለኪያ (ቴርሞሜትር) ይጠቀሙ። የመታጠቢያ ውሃ በአብዛኛው ከ105°F እስከ 115°F (ከ40°C እስከ 46°C ገደማ) ነው። የተቋሙን ደንብ ይከተሉ።<br>• መጀመሪያ ቀዝቃዛውን ውሃ ይክፈቱ፤ ከዚያ ሞቃቱን።<br>• ውሃውን በእጅ አንጓዎ ውስጠኛ ክፍል ይሞክሩ።<br>• ውሃው ምቹ መሆኑን ነዋሪውን ይጠይቁት።<br>• ለማስተካከል ቀዝቃዛ ወይም ሞቃት ውሃ ይጨምሩ። እንደገና ይሞክሩ።<br>• በሚታጠብበት ጊዜም ውሃውን እንደገና ይፈትሹ።<br>• በሻወር ጊዜ ነዋሪው ከመግባቱ በፊት ውሃውን ይሞክሩ።"}, {"en": "What should you do if a resident refuses to shower?", "am": "ነዋሪው ገላውን ለመታጠብ (ሻወር) ፈቃደኛ ካልሆነ ምን ማድረግ አለብዎት?", "bEn": "• Stay calm. Never force the resident.<br>• Ask why. The resident may be afraid, cold, tired, in pain, or embarrassed.<br>• Fix the problem if you can. Warm the room. Give privacy.<br>• Offer choices: another time, a bed bath, or a partial bath.<br>• Try again later.<br>• Tell the nurse that the resident refused.", "bAm": "• ረጋ ይበሉ። ነዋሪውን በጭራሽ አያስገድዱ።<br>• ለምን እንደሆነ ይጠይቁ። ነዋሪው ፈርቶ፣ ቀዝቅዞት፣ ደክሞት፣ ታሞ ወይም አፍሮ ሊሆን ይችላል።<br>• የሚችሉ ከሆነ ችግሩን ያስተካክሉ። ክፍሉን ያሞቁ። ግላዊነት ይስጡ።<br>• ምርጫዎችን ያቅርቡ፦ ሌላ ጊዜ፣ አልጋ ላይ መታጠብ ወይም ከፊል ገላ መታጠብ።<br>• ቆይተው እንደገና ይሞክሩ።<br>• ነዋሪው እምቢ ማለቱን ለነርሷ/ለነርሱ ይንገሩ።"}, {"en": "Should every resident use mouthwash? Why or why not?", "am": "እያንዳንዱ ነዋሪ አፍ መጣቢያ (ማውዝዋሽ) መጠቀም አለበት? ለምን ወይም ለምን አይሆንም?", "bEn": "• No. Not every resident should use mouthwash.<br>• Some mouthwash has alcohol. It can dry or burn the mouth.<br>• Some residents cannot spit. They may swallow it or choke.<br>• This is a risk for residents who are confused or have trouble swallowing.<br>• Mouthwash freshens the breath. It does not replace brushing.<br>• Use it only if the care plan or nurse says it is safe.", "bAm": "• አይ። እያንዳንዱ ነዋሪ አፍ መጣቢያ መጠቀም የለበትም።<br>• አንዳንድ አፍ መጣቢያዎች አልኮል አላቸው። አፍን ሊያደርቁ ወይም ሊያቃጥሉ ይችላሉ።<br>• አንዳንድ ነዋሪዎች መትፋት አይችሉም። ሊውጡት ወይም ሊታነቁ ይችላሉ።<br>• ይህ ለተምታታባቸው ወይም ለመዋጥ ለሚቸግራቸው ነዋሪዎች አደገኛ ነው።<br>• አፍ መጣቢያ የአፍ ጠረንን ያድሳል። ጥርስ መቦረሽን አይተካም።<br>• የእንክብካቤ ዕቅዱ ወይም ነርሷ/ነርሱ ደህንነቱ የተጠበቀ ነው ካሉ ብቻ ይጠቀሙ።"}, {"en": "What technique is used to dress a resident with an IV?", "am": "ደም ሥር ውስጥ ፈሳሽ (አይቪ) ያለበትን ነዋሪ ለማልበስ የሚጠቀሙበት ዘዴ ምንድን ነው?", "bEn": "<b>Undressing<\/b><br>1. Take the clothes off the arm without the IV first.<br>2. Then take the sleeve off the arm with the IV. Take the IV bag off the pole. Slide it through the sleeve. Do not pull the tubing.<br>3. Hang the bag back on the pole right away. Keep it above the level of the arm.<br><br><b>Dressing<\/b><br>1. Put the sleeve on the arm with the IV first. Take the bag off the pole, pass it through the sleeve, and hang it back up.<br>2. Then dress the other arm.<br><br><b>Important<\/b><br>1. Never disconnect the IV tubing. Never change the drip rate.<br>2. Report right away if the IV comes out or leaks. Also report if the skin is red, swollen, or painful, or if the alarm sounds.", "bAm": "<b>ማውለቅ<\/b><br>1. መጀመሪያ አይቪ ከሌለበት ክንድ ላይ ልብሱን ያውልቁ።<br>2. ከዚያ አይቪ ካለበት ክንድ ላይ እጅጌውን ያውልቁ። የአይቪ ቦርሳውን ከቋሚው ያውርዱ። በእጅጌው በኩል ያሳልፉት። ቱቦውን አይጎትቱ።<br>3. ቦርሳውን ወዲያውኑ ወደ ቋሚው መልሰው ይስቀሉ። ከክንዱ ከፍ ብሎ ይቆይ።<br><br><b>ማልበስ<\/b><br>1. መጀመሪያ አይቪ ባለበት ክንድ ላይ እጅጌውን ያልብሱ። ቦርሳውን ከቋሚው አውርደው በእጅጌው በኩል ያሳልፉና መልሰው ይስቀሉ።<br>2. ከዚያ ሌላውን ክንድ ያልብሱ።<br><br><b>አስፈላጊ<\/b><br>1. የአይቪ ቱቦውን በጭራሽ አይንቀሉ። የፈሳሹን የመንጠባጠብ ፍጥነት በጭራሽ አይቀይሩ።<br>2. አይቪው ከወጣ ወይም ከፈሰሰ ወዲያውኑ ሪፖርት ያድርጉ። ቆዳው ከቀላ፣ ካበጠ ወይም ከተጎዳ፣ ወይም ማንቂያ ከጮኸም ሪፖርት ያድርጉ።"}, {"en": "What is the procedure for performing peri-care on an uncircumcised resident?", "am": "ግርዛት ያልተደረገለትን ነዋሪ የብልት አካባቢ (ፔሪ) እንክብካቤ የማድረግ አሠራር ምንድን ነው?", "bEn": "1. Wash your hands and put on gloves. Explain what you will do. Give privacy.<br>2. Help the resident lie on his back. Cover him. Expose only the private area.<br>3. Gently pull the foreskin back.<br>4. Hold the penis. Wash the tip in a circle. Start at the opening and move outward.<br>5. Rinse and dry the tip gently.<br>6. Put the foreskin back to its normal position. This is very important. If it stays back, it can swell and hurt.<br>7. Wash down the shaft toward the body. Then wash the scrotum and groin. Rinse and dry.<br>8. Turn him on his side. Wash the rectal area from front to back. Rinse and dry.<br>9. Remove your gloves and wash your hands.<br>10. Report redness, swelling, sores, or drainage.", "bAm": "1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>2. ነዋሪው በጀርባው እንዲተኛ ይርዱት። ይሸፍኑት። የግል አካባቢውን ብቻ ይግለጡ።<br>3. የሸለፈቱን ቆዳ (ፎርስኪን) በቀስታ ወደ ኋላ ይሳቡት።<br>4. የወንድ ብልቱን ይያዙ። ጫፉን በክብ እንቅስቃሴ ይታጠቡ። ከመክፈቻው ጀምረው ወደ ውጭ ይሂዱ።<br>5. ጫፉን በቀስታ ያጥቡና ያደርቁ።<br>6. የሸለፈቱን ቆዳ ወደ መደበኛ ቦታው መልሰው ያድርጉት። ይህ በጣም አስፈላጊ ነው። ወደ ኋላ ከቀረ ሊያብጥና ሊያም ይችላል።<br>7. ሰውነቱ ወዳለበት አቅጣጫ ግንዱን ወደ ታች ይታጠቡ። ከዚያ የቆለጥ ከረጢቱንና የጭን መገናኛውን ይታጠቡ። ያጥቡና ያደርቁ።<br>8. ወደ ጎኑ ያዙሩት። የፊንጢጣ አካባቢን ከፊት ወደ ኋላ ይታጠቡ። ያጥቡና ያደርቁ።<br>9. ጓንትዎን አውልቀው እጅዎን ይታጠቡ።<br>10. መቅላት፣ እብጠት፣ ቁስል ወይም ፈሳሽ ካለ ሪፖርት ያድርጉ።"}, {"en": "What is the procedure for dressing and undressing a resident with a weak (affected) limb?", "am": "ደካማ (የተጎዳ) የአካል ክፍል ያለበትን ነዋሪ የማልበስና የማውለቅ አሠራር ምንድን ነው?", "bEn": "• Wash your hands. Explain what you will do. Give privacy.<br>• Let the resident choose the clothes. Loose clothes with front buttons or Velcro are easiest.<br>• Help the resident sit for support.<br><br><b>Undressing<\/b><br>• Take the clothes off the strong side first.<br>• Then take them off the weak side.<br><br><b>Dressing<\/b><br>• Put the clothes on the weak side first.<br>• Then put them on the strong side.<br>• Hold and support the weak arm or leg. Never pull on it.<br>• Ask if anything hurts. Be gentle.<br>• Put on socks and shoes. Make the resident comfortable.<br>Remember: strong side out first. Weak side in first.", "bAm": "• እጅዎን ይታጠቡ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>• ነዋሪው ልብሱን ራሱ ይምረጥ። ልል ያሉ፣ ከፊት በአዝራር ወይም በቬልክሮ የሚዘጉ ልብሶች ቀላል ናቸው።<br>• ነዋሪው ድጋፍ እንዲኖረው እንዲቀመጥ ይርዱት።<br><br><b>ማውለቅ<\/b><br>• መጀመሪያ ከጠንካራው ጎን ልብሱን ያውልቁ።<br>• ከዚያ ከደካማው ጎን ያውልቁ።<br><br><b>ማልበስ<\/b><br>• መጀመሪያ ደካማው ጎን ላይ ልብሱን ያልብሱ።<br>• ከዚያ ጠንካራው ጎን ላይ ያልብሱ።<br>• ደካማውን ክንድ ወይም እግር ደግፈው ይያዙ። በጭራሽ አይጎትቱት።<br>• የሚያም ነገር ካለ ይጠይቁ። በቀስታ ይሁኑ።<br>• ካልሲና ጫማ ያድርጉለት። ነዋሪውን ምቹ ያድርጉት።<br>ያስታውሱ፦ ማውለቅ ከጠንካራው ጎን ይጀምራል። ማልበስ ከደካማው ጎን ይጀምራል።"}, {"en": "What do you do when you find a rash on a resident?", "am": "በነዋሪው ላይ ሽፍታ ካገኙ ምን ማድረግ አለብዎት?", "bEn": "• Do not put any cream or lotion on it.<br>• Look at the rash. Note where it is, its color, and its size. Note if it has blisters or drainage.<br>• Ask the resident if it itches or hurts.<br>• Keep the skin clean and dry.<br>• Wear gloves. Some rashes can spread to others.<br>• Tell the nurse right away.<br>• Wash your hands well.", "bAm": "• ምንም ክሬም ወይም ሎሽን አይቀቡበት።<br>• ሽፍታውን ይመልከቱ። የት እንዳለ፣ ቀለሙንና መጠኑን ልብ ይበሉ። ብጉንጅ ወይም ፈሳሽ ካለም ልብ ይበሉ።<br>• የሚያሳክክ ወይም የሚያም መሆኑን ነዋሪውን ይጠይቁ።<br>• ቆዳውን ንጹሕና ደረቅ ያድርጉ።<br>• ጓንት ያድርጉ። አንዳንድ ሽፍታዎች ወደ ሌሎች ሊተላለፉ ይችላሉ።<br>• ወዲያውኑ ለነርሷ/ለነርሱ ይንገሩ።<br>• እጅዎን በደንብ ይታጠቡ።"}, {"en": "How do you care for and clean hearing aids?", "am": "የመስሚያ መርጃዎችን እንዴት ይንከባከባሉ፣ ያጸዳሉ?", "bEn": "• Handle them gently. Hold them over a soft surface in case they drop.<br>• Wipe the aid with a soft, dry cloth or tissue.<br>• Clean earwax from the ear mold with the small brush or pick that comes with it.<br>• Never put the hearing aid in water. Never use alcohol on it.<br>• Keep it away from heat.<br>• Turn it off when it is not in use. Open the battery door at night.<br>• Store it in its labeled case.<br>• Replace dead batteries. Report a broken aid to the nurse.", "bAm": "• በጥንቃቄ ይያዟቸው። ቢወድቁ ለስላሳ ገጽ ላይ ይያዟቸው።<br>• መርጃውን በለስላሳ ደረቅ ጨርቅ ወይም ቲሹ ይጥረጉ።<br>• ከጆሮ ማስገቢያው (ኢር ሞልድ) የጆሮ ኩክ ከመርጃው ጋር በሚመጣው ትንሽ ብሩሽ ወይም ማስወገጃ ያጽዱ።<br>• መርጃውን ውሃ ውስጥ በጭራሽ አይንከሩት። አልኮል በጭራሽ አይጠቀሙበት።<br>• ከሙቀት ያርቁት።<br>• ጥቅም ላይ በማይውልበት ጊዜ ያጥፉት። በሌሊት የባትሪውን ክዳን ይክፈቱ።<br>• ስም በተጻፈበት መያዣው ውስጥ ያስቀምጡት።<br>• የሞቱ ባትሪዎችን ይቀይሩ። የተበላሸ መርጃ ካለ ለነርሷ/ለነርሱ ሪፖርት ያድርጉ።"}, {"en": "How often should the skin be checked when a resident wears a prosthesis?", "am": "ሰው ሠራሽ የአካል ክፍል የሚጠቀም ነዋሪ ቆዳ ምን ያህል ጊዜ መመርመር አለበት?", "bEn": "• Check the skin every time you put the prosthesis on or take it off.<br>• Check at least once a day.<br>• Look for redness, sores, blisters, swelling, or pressure marks.<br>• Report any skin problem to the nurse. Do not let the resident wear the prosthesis until the nurse says it is OK.", "bAm": "• ሰው ሠራሽ የአካል ክፍሉን ባደረጉ ወይም ባወለቁ ቁጥር ቆዳውን ይመርምሩ።<br>• ቢያንስ በቀን አንድ ጊዜ ይመርምሩ።<br>• መቅላት፣ ቁስል፣ ብጉንጅ፣ እብጠት ወይም የግፊት ምልክቶች ካሉ ይመልከቱ።<br>• ማንኛውንም የቆዳ ችግር ለነርሷ/ለነርሱ ሪፖርት ያድርጉ። ነርሷ/ነርሱ እሺ እስኪሉ ድረስ ነዋሪው ሰው ሠራሽ የአካል ክፍሉን እንዲያደርግ አይፍቀዱ።"}, {"en": "What is the best treatment for a resident with hemorrhoids?", "am": "ኪንታሮት (ሄሞሮይድ) ላለበት ነዋሪ ምርጡ ሕክምና ምንድን ነው?", "bEn": "• Tell the nurse. The doctor decides the treatment.<br>• Prevent constipation. Give enough fluids and fiber foods, unless the resident is on limits.<br>• Help the resident walk and move. Do not let the resident strain on the toilet.<br>• Do gentle peri-care. Keep the area clean and dry.<br>• Warm sitz baths or cool packs can help, when ordered.<br>• Creams or suppositories are given only by the nurse.<br>• Report bleeding or pain.", "bAm": "• ለነርሷ/ለነርሱ ይንገሩ። ሕክምናውን የሚወስነው ሐኪሙ ነው።<br>• ሆድ ድርቀትን ይከላከሉ። ገደብ ከሌለበት በቂ ፈሳሽና ፋይበር ያለው ምግብ ይስጡ።<br>• ነዋሪው እንዲራመድና እንዲንቀሳቀስ ይርዱት። መጸዳጃ ላይ እንዲጨነቅ አይፍቀዱ።<br>• በቀስታ የብልት አካባቢ (ፔሪ) እንክብካቤ ያድርጉ። አካባቢውን ንጹሕና ደረቅ ያድርጉ።<br>• ትእዛዝ ከተሰጠ፣ ሞቅ ያለ የሲትዝ መታጠቢያ ወይም ቀዝቃዛ ጭምቅ ሊረዳ ይችላል።<br>• ክሬምና ሱፖዚቶሪን የሚሰጡት ነርሶች ብቻ ናቸው።<br>• ደም መፍሰስ ወይም ህመም ካለ ሪፖርት ያድርጉ።"}, {"en": "Describe the procedure for emptying a colostomy bag. How often should a colostomy bag be emptied?", "am": "የኮሎስቶሚ ቦርሳን ባዶ የማድረግ አሠራርን ግለጹ። የኮሎስቶሚ ቦርሳ ምን ያህል ጊዜ ባዶ መደረግ አለበት?", "bEn": "<b>How often<\/b><br>1. Empty the bag when it is one-third to one-half full. Do not let it get too full.<br><br><b>Procedure<\/b><br>1. Wash your hands and put on gloves. Explain what you will do. Give privacy.<br>2. Put a pad or towel under the bag.<br>3. Hold the bottom of the bag over a bedpan or toilet. Open the clip.<br>4. Empty the stool into the bedpan or toilet. Look at the color, amount, and how firm it is.<br>5. Wipe the bottom of the bag with toilet paper. Close the clip.<br>6. Remove the pad. Remove your gloves and wash your hands.<br>7. Write down what you saw. Report blood or anything unusual.", "bAm": "<b>ምን ያህል ጊዜ<\/b><br>1. ቦርሳው አንድ ሦስተኛ እስከ ግማሽ ሲሞላ ባዶ ያድርጉት። በጣም እንዲሞላ አይፍቀዱ።<br><br><b>አሠራር<\/b><br>1. እጅዎን ይታጠቡ፤ ጓንት ያድርጉ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>2. ከቦርሳው በታች ፓድ ወይም ፎጣ ያድርጉ።<br>3. የቦርሳውን የታችኛው ክፍል በቤድፓን ወይም በመጸዳጃ ላይ ይያዙ። ማያያዣውን ይክፈቱ።<br>4. ሰገራውን ወደ ቤድፓኑ ወይም መጸዳጃው ባዶ ያድርጉ። ቀለሙን፣ መጠኑንና ጠንካራነቱን ይመልከቱ።<br>5. የቦርሳውን ታች በሽንት ቤት ወረቀት ይጥረጉ። ማያያዣውን ይዝጉ።<br>6. ፓዱን ያንሱ። ጓንትዎን አውልቀው እጅዎን ይታጠቡ።<br>7. ያዩትን ይጻፉ። ደም ወይም ማንኛውም ያልተለመደ ነገር ካለ ሪፖርት ያድርጉ።"}, {"en": "Describe the procedure for applying anti-embolism stockings.", "am": "የደም መርጋት መከላከያ ካልሲዎችን (ፀረ-ኤምቦሊዝም ስቶኪንግ) የማድረግ አሠራርን ግለጹ።", "bEn": "1. Apply them in the morning, before the resident gets out of bed. Swelling is lowest then.<br>2. Wash your hands. Explain what you will do. Give privacy.<br>3. Help the resident lie flat on his or her back.<br>4. Check the legs and feet for redness, sores, or swelling.<br>5. Turn the stocking inside out down to the heel.<br>6. Put the foot in. Make sure the heel fits in the heel pocket.<br>7. Pull the stocking up over the leg, smooth and without wrinkles.<br>8. The toe opening should be under the toes. Do not let it roll or bunch.<br>9. Check that the toes are pink and warm.<br>10. Report toes that are blue, pale, cold, numb, or painful. Report if the stocking is too tight.<br>11. Take them off as ordered so you can check the skin.", "bAm": "1. በጠዋት፣ ነዋሪው ከአልጋ ከመውረዱ በፊት ያድርጓቸው። በዚያን ጊዜ እብጠት ዝቅተኛ ነው።<br>2. እጅዎን ይታጠቡ። የሚያደርጉትን ያስረዱ። ግላዊነቱን ይጠብቁ።<br>3. ነዋሪው በጀርባው ጠፍጣፋ ሆኖ እንዲተኛ ይርዱት።<br>4. እግሮችንና የእግር ጣቶችን መቅላት፣ ቁስል ወይም እብጠት ካለ ይመልከቱ።<br>5. ካልሲውን እስከ ተረከዙ ድረስ ወደ ውስጥ ገልብጠው ይያዙት።<br>6. እግሩን ያስገቡ። ተረከዙ በተረከዝ ኪሱ ውስጥ መግባቱን ያረጋግጡ።<br>7. ካልሲውን እግሩ ላይ ለስላሳ አድርገው፣ መጨማደድ ሳይኖር ወደ ላይ ይሳቡት።<br>8. የጣቶቹ መክፈቻ ከጣቶቹ ስር መሆን አለበት። እንዲጠቀለል ወይም እንዲከማች አይፍቀዱ።<br>9. ጣቶቹ ሮዝና ሞቃት መሆናቸውን ያረጋግጡ።<br>10. ጣቶቹ ሰማያዊ፣ ገርጣ፣ ቀዝቃዛ፣ የደነዘዙ ወይም የሚያሙ ከሆነ ሪፖርት ያድርጉ። ካልሲው በጣም ካጠበቀም ሪፖርት ያድርጉ።<br>11. ቆዳውን ለመመርመር በትእዛዙ መሠረት ያውልቁዋቸው።"}]}];
const $=s=>document.querySelector(s);
let d=0,order=[],pos=0,flip=false,shuf=false,only=false,view="cards",st={};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}};
const save=()=>{try{localStorage.setItem("na:"+DECKS[d].id,JSON.stringify(st))}catch(e){}};
const cards=()=>DECKS[d].cards;
function pick(){
  let a=cards().map((c,i)=>i).filter(i=>!only||st[cards()[i].en]!=="known");
  if(shuf)for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}
  order=a;pos=0;flip=false;
}
function stats(){
  const k=cards().filter(c=>st[c.en]==="known").length,l=cards().filter(c=>st[c.en]==="learn").length;
  return `<div class="bar"><i style="width:${k/cards().length*100}%"></i></div><div class="stat"><span>✓ Got it: ${k} · ✗ Still learning: ${l} · Total: ${cards().length}</span></div>`;
}
const front=c=>`<p class="tag">English</p><div class="en">${c.en}</div><p class="tag">አማርኛ</p><div class="am">${c.am}</div>`;
const back=c=>`<div class="side"><p class="tag">English</p><div class="en">${c.bEn}</div><hr><p class="tag">አማርኛ</p><div class="am">${c.bAm}</div></div>`;
function render(){
  $("#decks").innerHTML=DECKS.map((k,i)=>`<button class="deck ${i==d?"on":""}" data-d="${i}">${k.title}<br><small>${k.cards.length} cards</small></button>`).join("");
  $("#bShuf").setAttribute("aria-pressed",shuf);$("#bLearn").setAttribute("aria-pressed",only);
  $("#bView").textContent=view=="cards"?"List view | ዝርዝር":"Flashcards | ካርዶች";
  $("#bShuf").style.display=$("#bLearn").style.display=view=="cards"?"":"none";
  $("#app").innerHTML=view=="cards"?renderCard():renderList();
}
function renderCard(){
  if(!order.length)return stats()+`<div class="done"><h2>🎉 Nothing left here!</h2><p>ሁሉንም አጠናቀዋል።</p></div>`;
  const c=cards()[order[pos]],s=st[c.en];
  return stats()+`<div class="stat"><span>Card ${pos+1} of ${order.length}</span><span>${s=="known"?"✓ Got it":s=="learn"?"✗ Still learning":""}</span></div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">${flip?back(c):front(c)}<div class="hint">${flip?"Tap to see the question | ጥያቄውን ለማየት ይንኩ":"Tap to see the answer | መልሱን ለማየት ይንኩ"}</div></div>
  <div class="nav"><button data-a="prev">← Back | ተመለስ</button><button data-a="next">Next | ቀጣይ →</button>
  <button class="learn" data-a="learn">✗ Still learning | ገና እማራለሁ</button><button class="know" data-a="know">✓ Got it | ገባኝ</button></div>
  <p class="hint">Keys: ← → move · Space flips · 1 = still learning · 2 = got it</p>`;
}
function renderList(){
  return stats()+`<div class="row"><input type="search" id="q" placeholder="Search | ፈልግ" aria-label="Search"></div><div id="list">`+
  cards().map(c=>`<details class="item" data-s="${st[c.en]||""}"><summary>${c.en}<span>${c.am}</span></summary>${back(c)}</details>`).join("")+`</div>`;
}
function go(n){pos=Math.max(0,Math.min(order.length-1,n));flip=false;render();$("#card")&&$("#card").focus({preventScroll:true})}
function mark(v){const c=cards()[order[pos]];st[c.en]=v;save();if(only&&v=="known"){order.splice(pos,1);if(pos>=order.length)pos=Math.max(0,order.length-1);flip=false;render()}else if(pos<order.length-1)go(pos+1);else render()}
function setDeck(i){d=i;st=load("na:"+DECKS[d].id);pick();render()}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,#card");if(!t)return;
  if(t.dataset.d!=null)return setDeck(+t.dataset.d);
  if(t.id=="card"){flip=!flip;return render()}
  const a=t.dataset.a;
  if(a=="prev")go(pos-1);else if(a=="next")go(pos+1);else if(a=="learn")mark("learn");else if(a=="know")mark("known");
});
$("#bShuf").onclick=()=>{shuf=!shuf;pick();render()};
$("#bLearn").onclick=()=>{only=!only;pick();render()};
$("#bView").onclick=()=>{view=view=="cards"?"list":"cards";render()};
$("#bReset").onclick=()=>{if(confirm("Clear your progress on this deck? | ሂደትዎን ለማጥፋት ይፈልጋሉ?")){st={};save();pick();render()}};
document.addEventListener("input",e=>{if(e.target.id!="q")return;const v=e.target.value.toLowerCase();
  document.querySelectorAll(".item").forEach(x=>x.style.display=x.textContent.toLowerCase().includes(v)?"":"none")});
document.addEventListener("keydown",e=>{
  if(view!="cards"||/INPUT|TEXTAREA/.test(e.target.tagName)||!order.length)return;
  if(e.key=="ArrowRight")go(pos+1);else if(e.key=="ArrowLeft")go(pos-1);
  else if(e.key==" "||e.key=="Enter"){e.preventDefault();flip=!flip;render();$("#card").focus({preventScroll:true})}
  else if(e.key=="1")mark("learn");else if(e.key=="2")mark("known");
});
setDeck(0);
</script>
</body>
</html>
